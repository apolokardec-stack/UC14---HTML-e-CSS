<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>polo reliquias</title>
  <style>
      h1{
    font-size: 70px;
    text-align: center;
    margin-top: 30px;

    /* Fonte de estilo urbano */
    font-family: Impact, fantasy;

    color: #00ff88;

    /* Contorno preto */
    -webkit-text-stroke: 2px black;

    /* Sombra e brilho */
    text-shadow:
        0 0 5px #00ff88,
        0 0 15px #00ff88,
        0 0 30px #00ff88,
        3px 3px 0 black;

    animation: brilho 2s infinite alternate;
}

@keyframes brilho{
    from{
        text-shadow:
            0 0 5px #00ff88,
            0 0 15px #00ff88,
            0 0 30px #00ff88,
            3px 3px 0 black;
    }

    to{
        text-shadow:
            0 0 15px #00ff88,
            0 0 35px #00ff88,
            0 0 60px #00ff88,
            3px 3px 0 black;
    }
}
.produtos{
    display: flex;
    justify-content: center;
    gap: 30px;
    flex-wrap: wrap;
    margin-top: 50px;
}

.card{
    width: 220px;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(8px);
    border-radius: 25px;
    padding: 20px;
    text-align: center;
    color: white;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);

    animation: flutuar 3s infinite ease-in-out;
    transition: 0.3s;
}

.card:hover{
    transform: scale(1.08);
    box-shadow: 0 0 30px gold;
}

.card img{
    width: 180px;
    height: 180px;
    object-fit: contain;
}

@keyframes flutuar{
    0%{
        transform: translateY(0);
    }

    50%{
        transform: translateY(-12px);
    }

    100%{
        transform: translateY(0);
    }
}
    
  </style>
</head>
   <h1 class="titulo">POLO RELÍQUIAS👑</h1>
<body>

  <div class="produtos">

    <div class="card">
        <img src="chuteira1.png" alt="Chuteira">
        <h3>Nike Mercurial R9</h3>
        <p>R$ 1.999</p>
    </div>

    <div class="card">
        <img src="chuteira2.png" alt="Chuteira">
        <h3>Adidas Predator</h3>
        <p>R$ 1.499</p>
    </div>

    <div class="card">
        <img src="camisa.png" alt="Camisa">
        <h3>Camisa Retrô</h3>
        <p>R$ 799</p>
    </div>

</div>
</body>
</html>
