<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loja gameroverse</title>
<style>
:root{
    --cor-primaria: #1100ff;
    --cor-secundaria: #111827;
    --cor-texto: white;
    background-image: url("img2.jpg");
}

*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body{
    background: var(--cor-fundo);
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}
.card{
    background: var(--cor-secundaria);
    width: 700px;
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
}

.card img{
    width: 100%;
    border-radius: 15px;
    margin: 20px 0;
}

.titulo{
    color: var(--cor-primaria);
    margin-bottom: 15px;
}

.descricao{
    color: var(--cor-texto);
    margin-bottom: 20px;
}

.botoes{
    display: flex;
    justify-content: center;
    gap: 15px;
}

.btn{
    background: var(--cor-primaria);
    color: black;
    border: none;
    padding: 12px 25px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s;
}

.btn:hover{
    opacity: 0.8;
    transform: scale(1.05);
}

</style>
<body>
    <div class="card">

        <h1 class="titulo">gameoverse</h1>

    <p class="descricao">
        Descubra em nossa loja os melhores jogos para PC, PlayStation, Xbox e Nintendo.
        Promoções incríveis e lançamentos exclusivos!
        incluindo ate jogos e consoles mais antigos e os classicos com preços muitos bons!!
    </p>
    p

    <img src="img3.png" alt="gameoverse">

  <div class="buttons">
    <button class="btn">veja nossa localizaçao</button>
    <button class="btn">catalogo de jogos</button>


  </div>



    </div>



   

    
</body>
</html>
